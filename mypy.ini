[mypy]
mypy_path = backend

# pgvector ships no py.typed marker / stub package, so mypy cannot
# analyze its types no matter how it's imported (backend/vectorstore/store.py
# imports it legitimately: `from pgvector.psycopg import register_vector`,
# registering the `vector` type adapter for psycopg — see that file's own
# module docstring). This is a third-party packaging gap, not a typing
# issue in our own code, so the exemption is scoped to exactly that
# module namespace rather than a global `ignore_missing_imports` — every
# other third-party and first-party import is still fully checked.
[mypy-pgvector.*]
ignore_missing_imports = True

# fastembed (and huggingface_hub, which it brings) require Python >= 3.10
# and are installed only there (backend/requirements.txt markers): they are
# absent from an older local venv, so mypy could not resolve them at all.
# Both are imported lazily, in vectorstore/embeddings/fastembed_provider.py
# only; scoped to those namespaces, nothing else is exempted.
[mypy-fastembed.*]
ignore_missing_imports = True

[mypy-huggingface_hub.*]
ignore_missing_imports = True
