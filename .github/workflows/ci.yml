# Phase 15: CI verification — deliberately CI only, no CD/deploy job.
#
# F8 additions: a `frontend` job (Vitest, production build, npm audit);
# pinned test tools; a Python dependency audit of the SHIPPED backend image
# against a reviewed accept-list (.github/pip-audit-accepted.txt), so any
# new advisory fails the build; and separate application/test databases so
# tests/conftest.py's guard (pytest refuses to run against DATABASE_URL)
# holds in CI too.
#
# This workflow verifies the codebase (tests, types, security tests,
# diff hygiene, Docker image builds). It does NOT deploy anything
# anywhere: there is no actual deployment target, registry, or hosting
# credential configured for this project (see docs/deployment.md), and
# per this project's own instructions, deployment must never be
# automated against infrastructure that hasn't actually been
# provisioned. If a real deployment target is added later, that
# belongs in a SEPARATE workflow (e.g. cd.yml), gated on this one
# passing first, and using GitHub Actions' own encrypted secrets —
# never a value committed to this repository.
#
# NOTE: this workflow has been reasoned through carefully to mirror
# the exact local verification commands already proven to work in this
# project's development environment (full test suite, mypy, security
# tests, Docker builds — see this repository's own session history in
# docs/deployment.md), but it has NOT been executed on GitHub Actions
# itself as part of building it (that would require pushing, which is
# out of scope for this phase). Treat it as a carefully-designed,
# unexecuted pipeline until it has actually run once.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# F8: least privilege for the automatic GITHUB_TOKEN. This workflow only
# reads the repository; it never pushes, comments, or publishes.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # PostgreSQL 18 + pgvector 0.8.6: the project's documented major
        # version (README, docs/architecture.md) and the exact extension
        # version used locally. Pinned so CI doesn't drift silently.
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_swe_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches tests/vectorstore/conftest.py's TEST_DATABASE_URL fallback
      # pattern, pointed at the service container above instead of a
      # local Homebrew Postgres.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_swe_agent_test
      # F8: a DIFFERENT database (created below). tests/conftest.py refuses
      # a session whose TEST_DATABASE_URL is the application's database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_swe_agent_app
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: testpassword
      # Deliberately NOT set: LLM_API_KEY, EMBEDDING_API_KEY, GITHUB_TOKEN,
      # LANGSMITH_API_KEY — every test suite in this project already skips
      # cleanly (never fails) when these are absent, using StubLLMProvider/
      # DeterministicLocalEmbeddingProvider instead (see docs/architecture.md).
      # CI must never be given real production credentials.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # F8: pinned to the versions verified locally (reproducible CI).
          pip install pytest==8.4.2 mypy==1.19.1 types-requests==2.32.4.20260107 httpx==0.28.1 pip-audit==2.9.0

      - name: Initialise the CI databases (separate app database, pgvector enabled)
        # The service container creates only ai_swe_agent_test, and a fresh
        # database has no `vector` type. VectorStore.connect() calls
        # pgvector's register_vector() BEFORE schema.sql's own
        # `CREATE EXTENSION IF NOT EXISTS vector` can run, so on a fresh
        # database every vector-store test failed at setup with "vector type
        # not found in the database". Enabling the extension first is the
        # provisioning step a real database gets too. Idempotent. vector is
        # the only extension the schema needs (no PostGIS).
        # Both URLs come from the job env above; they name DIFFERENT
        # databases, so tests/conftest.py's guard stays meaningful.
        run: |
          python - <<'EOF'
          import os
          import psycopg
          from psycopg import sql

          test_url, app_url = os.environ["TEST_DATABASE_URL"], os.environ["DATABASE_URL"]
          app_db = psycopg.conninfo.conninfo_to_dict(app_url)["dbname"]
          assert test_url != app_url, "CI test and application databases must differ"
          with psycopg.connect(test_url, autocommit=True) as admin:
              if not admin.execute("SELECT 1 FROM pg_database WHERE datname = %s", (app_db,)).fetchone():
                  admin.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(app_db)))
          for url in (test_url, app_url):
              with psycopg.connect(url, autocommit=True) as conn:
                  conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  db, server, vector = conn.execute(
                      "SELECT current_database(), current_setting('server_version'),"
                      " (SELECT extversion FROM pg_extension WHERE extname = 'vector')"
                  ).fetchone()
                  print(f"{db}: PostgreSQL {server}, vector {vector}")
          EOF

      - name: Apply the schema to the application database (explicit migration step)
        # The same deliberate migration step a deploy runs
        # (backend/scripts/apply_schema.py: schema.sql + LangGraph checkpoint
        # tables), proven on a fresh database after the extension exists.
        # Tests apply the schema to TEST_DATABASE_URL themselves via fixtures.
        run: python backend/scripts/apply_schema.py

      - name: Build the Phase 10 sandbox image
        # Required by tests/sandbox and tests/security's real-Docker
        # tests; they skip cleanly (never fail) if this image is
        # missing, but building it here means CI exercises the real
        # sandbox rather than skipping it.
        run: |
          docker build -t ai-swe-agent-sandbox-python:latest \
            -f backend/sandbox/docker/python-test.Dockerfile backend/sandbox/docker

      - name: Run the full test suite
        run: python -m pytest -q

      - name: Run the security regression suite explicitly
        run: python -m pytest tests/security -q

      - name: Type check
        run: python -m mypy backend

      - name: Diff / whitespace check
        run: git diff --check

      - name: Build the production backend image
        run: docker build -t ai-swe-agent-backend:ci -f backend/Dockerfile .

      - name: Verify the backend image runs as non-root, has git, and has no baked-in secrets
        run: |
          docker run --rm ai-swe-agent-backend:ci whoami | grep -qx appuser
          # F3: the ingestion worker clones with the git CLI.
          docker run --rm ai-swe-agent-backend:ci git --version
          test -z "$(docker run --rm ai-swe-agent-backend:ci find /app -iname '*.env*')"

      - name: Audit the Python packages that actually ship (pip-audit, OSV)
        # The image's own `pip freeze` — exactly what production runs —
        # audited without resolving or installing anything. Every accepted
        # advisory is listed WITH its reachability reasoning in
        # .github/pip-audit-accepted.txt; anything else fails this step.
        run: |
          docker run --rm ai-swe-agent-backend:ci pip freeze > shipped-requirements.txt
          IGNORES=$(grep -oE '^(PYSEC|GHSA|CVE)-[A-Za-z0-9-]+' .github/pip-audit-accepted.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r shipped-requirements.txt --disable-pip --no-deps -s osv --timeout 90 $IGNORES

      - name: Run the production configuration validation script
        # DATABASE_URL (the one required setting) is set above from the
        # service container; every optional setting (LLM_API_KEY, GITHUB_TOKEN,
        # ...) is intentionally absent in CI, so this is expected to exit 0
        # while reporting those as "not set (optional)" — never printing a value.
        run: python backend/scripts/check_production_config.py

  frontend:
    # F8: the Engineering Lab (Next.js backend-for-frontend). No secrets:
    # the build needs none (every page is rendered per request), and tests
    # use their own fake values.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"  # package.json engines: >=24.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly the locked dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit
